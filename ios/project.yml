name: NanoframeIOS
options:
  bundleIdPrefix: com.nanoframe
  deploymentTarget:
    iOS: "16.0"
  xcodeVersion: "15"

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    PRODUCT_NAME: Nanoframe

targets:
  NanoframeIOS:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources:
      - path: Sources/NanoframeIOS
        excludes:
          - Resources/Info.plist
    resources:
      - Sources/NanoframeIOS/Resources
    info:
      path: Sources/NanoframeIOS/Resources/Info.plist
      properties:
        CFBundleName: Nanoframe
        CFBundleDisplayName: Nanoframe
        UILaunchScreen:
          UIColorName: systemBackground
        NSLocalNetworkUsageDescription: "Nanoframe connects to your Samsung Frame TV over Wi-Fi to display AI-generated art."
        NSPhotoLibraryAddUsageDescription: "Save generated artwork to your Photos library."
        NSCameraUsageDescription: "Capture a source photo to guide AI image generation."
        NSBonjourServices:
          - "_samsungavrccommand._tcp"
        BGTaskSchedulerPermittedIdentifiers:
          - "com.nanoframe.revert"
        UIBackgroundModes:
          - processing
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    entitlements:
      path: NanoframeIOS.entitlements
    settings:
      base:
        DEVELOPMENT_TEAM: ""     # fill in your Team ID
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
